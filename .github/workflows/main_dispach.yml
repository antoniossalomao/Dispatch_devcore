# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Dispach

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '26.x'

      - name: Install dependencies and test
        working-directory: server
        run: |
          npm ci
          npm test

      - name: Package Dispatch
        run: |
          mkdir deploy
          git archive HEAD client server | tar -x -C deploy
          npm ci --prefix deploy/server --omit=dev
          tar -czf dispatch.tar.gz -C deploy .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: dispatch.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Extract deployment package
        run: |
          mkdir deploy
          tar -xzf dispatch.tar.gz -C deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: "2cca9334-4dd9-413b-8134-d92408dd4504"
          tenant-id: "a835aabf-a16a-4ba6-83e7-0ddfc5fd325e"
          subscription-id: "06fefd23-91c9-421b-9afe-49af88598bad"

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Dispach'
          slot-name: 'Production'
          package: deploy

