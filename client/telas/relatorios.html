<!-- Fragmento da tela "Relatórios": a casca (app.html) encaixa cada parte no lugar certo. -->
<template data-parte="cabecalho" data-titulo="Relatórios">
        <h1 class="topo-titulo">Relatórios</h1>
        <span class="topo-data">Ocupação, uso da frota, gargalos e quem estava dirigindo</span>
</template>
<template data-parte="acoes" data-classe="periodo-filtro"><label class="campo-label" for="rel-de">De</label>
        <input type="date" id="rel-de" class="config-input campo-data periodo-data">
        <label class="campo-label" for="rel-ate">Até</label>
        <input type="date" id="rel-ate" class="config-input campo-data periodo-data">
        <button type="button" id="botao-atualizar" class="btn-secundario">Atualizar</button>
</template>
<template data-parte="conteudo" data-classe="conteudo">

      <div class="filtro-abas rel-abas">
        <button type="button" class="aba-item rel-aba ativa" data-aba="ocupacao">Ocupação</button>
        <button type="button" class="aba-item rel-aba" data-aba="frota">Uso da frota</button>
        <button type="button" class="aba-item rel-aba" data-aba="gargalos">Gargalos</button>
        <button type="button" class="aba-item rel-aba" data-aba="dirigindo">Quem estava dirigindo</button>
        <button type="button" class="aba-item rel-aba" data-aba="ia">Perguntar à IA</button>
      </div>

      <section id="aba-ocupacao" class="bloco rel-secao">
        <div class="bloco-cabecalho"><h2 class="bloco-titulo">Ocupação dos alojamentos</h2></div>
        <div id="rel-ocupacao" class="rel-corpo"></div>
      </section>

      <section id="aba-frota" class="bloco rel-secao" hidden>
        <div class="bloco-cabecalho"><h2 class="bloco-titulo">Uso por veículo</h2></div>
        <div class="tabela-area">
          <table class="tabela">
            <thead><tr><th>Veículo</th><th class="num">Viagens</th><th class="num">Km rodados</th><th class="num">Horas em uso</th><th>Utilização</th><th class="num">Dias sem uso</th></tr></thead>
            <tbody id="rel-frota"></tbody>
          </table>
        </div>
      </section>

      <section id="aba-gargalos" class="bloco rel-secao" hidden>
        <div class="bloco-cabecalho"><h2 class="bloco-titulo">Gargalos e pontos de atenção</h2></div>
        <div id="rel-gargalos" class="rel-corpo lista-alertas"></div>
      </section>

      <section id="aba-dirigindo" class="bloco rel-secao" hidden>
        <div class="bloco-cabecalho"><h2 class="bloco-titulo">Quem estava dirigindo o veículo?</h2></div>
        <div class="rel-corpo">
          <p class="campo-dica">Útil para indicar o condutor em caso de multa (evita a multa por Não Indicação do Condutor).</p>
          <form id="form-dirigindo" class="form-linha">
            <div class="campo-grupo">
              <label for="dir-veiculo" class="campo-label">Veículo</label>
              <select id="dir-veiculo" class="config-select" required></select>
            </div>
            <div class="campo-grupo">
              <label for="dir-quando" class="campo-label">Data e hora da infração</label>
              <input type="datetime-local" id="dir-quando" class="config-input campo-data" required>
            </div>
            <button type="submit" class="btn-primario">Consultar</button>
          </form>
          <div id="dir-resultado" class="resultado-caixa" hidden></div>
        </div>
      </section>

      <section id="aba-ia" class="bloco rel-secao" hidden>
        <div class="bloco-cabecalho"><h2 class="bloco-titulo">Pergunte sobre os dados</h2></div>
        <div class="rel-corpo">
          <p class="campo-dica">A IA recebe só números do período selecionado (nunca nomes de colaboradores).</p>
          <form id="form-ia" class="form-linha">
            <div class="campo-grupo campo-grande">
              <label for="ia-pergunta" class="campo-label">Pergunta</label>
              <input type="text" id="ia-pergunta" class="config-input" maxlength="500" placeholder="Ex: Qual veículo ficou mais ocioso no período?" required>
            </div>
            <button type="submit" class="btn-primario">Perguntar</button>
            <button type="button" id="botao-resumo-ia" class="btn-secundario">Resumir o período</button>
          </form>
          <div id="ia-resultado" class="resultado-caixa" hidden></div>
        </div>
      </section>
</template>
<template data-parte="extras"><div id="toast-rel" class="toast" hidden></div>
</template>
