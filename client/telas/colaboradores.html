<!-- Fragmento da tela "Colaboradores": a casca (app.html) encaixa cada parte no lugar certo. -->
<template data-parte="cabecalho" data-titulo="Colaboradores">
        <h1 class="topo-titulo">Colaboradores</h1>
        <span id="subtitulo-contagem" class="topo-data">Gestão de equipe, habilitações e histórico</span>
        <span id="aviso-tela" class="topo-aviso" hidden></span>
</template>
<template data-parte="acoes" data-classe=""><button type="button" id="botao-seed" class="btn-secundario" hidden>Carregar dados de demonstração</button>
        <button type="button" id="botao-novo-colaborador" class="btn-primario">+ Novo colaborador</button>
</template>
<template data-parte="conteudo" data-classe="conteudo">

      <!-- indicadores rápidos de pessoal -->
      <section class="indicadores">
        <div class="cartao-kpi">
          <div class="kpi-topo">
            <span class="kpi-rotulo">Quadro total</span>
          </div>
          <div class="kpi-valor-linha">
            <strong id="kpi-total-ativos" class="kpi-numero">0</strong>
            <span class="kpi-complemento">colaboradores ativos</span>
          </div>
          <p id="kpi-detalhe-ativos" class="kpi-detalhe">Equipe disponível nas obras</p>
        </div>

        <div class="cartao-kpi">
          <div class="kpi-topo">
            <span class="kpi-rotulo">Motoristas habilitados</span>
          </div>
          <div class="kpi-valor-linha">
            <strong id="kpi-com-cnh" class="kpi-numero">0</strong>
            <span id="kpi-pct-cnh" class="kpi-complemento">com CNH válida</span>
          </div>
          <p class="kpi-detalhe">Aptos para condução de veículos</p>
        </div>

        <div class="cartao-kpi">
          <div class="kpi-topo">
            <span class="kpi-rotulo">Atenção CNH</span>
          </div>
          <div class="kpi-valor-linha">
            <strong id="kpi-cnh-alerta" class="kpi-numero">0</strong>
            <span class="kpi-complemento">vencendo ou vencidas</span>
          </div>
          <p class="kpi-detalhe">Evita multa e bloqueio de saída</p>
        </div>

        <div class="cartao-kpi">
          <div class="kpi-topo">
            <span class="kpi-rotulo">Alocados agora</span>
          </div>
          <div class="kpi-valor-linha">
            <strong id="kpi-alojados" class="kpi-numero">0</strong>
            <span id="kpi-transito-txt" class="kpi-complemento">em alojamento</span>
          </div>
          <p id="kpi-em-transito" class="kpi-detalhe">0 em trânsito com veículo</p>
        </div>
      </section>

      <!-- bloco com tabela e busca -->
      <section class="bloco">
        <div class="bloco-cabecalho">
          <div class="colab-filtros-topo">
            <div class="busca-caixa busca-larga">
              <svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
              </svg>
              <input type="text" id="campo-busca" placeholder="Buscar colaboradores" aria-label="Buscar por nome, matrícula, cargo ou obra" name="campo-busca" autocomplete="off">
            </div>

            <div class="filtro-abas">
              <button type="button" class="aba-item ativa" data-filtro-cnh="todos">Todos</button>
              <button type="button" class="aba-item" data-filtro-cnh="com_cnh">Habilitados</button>
              <button type="button" class="aba-item" data-filtro-cnh="vencendo">CNH em atenção</button>
              <button type="button" class="aba-item" data-filtro-cnh="sem_cnh">Sem CNH</button>
            </div>
          </div>

          <div class="seletor-status">
            <select id="seletor-status-ativo" class="config-select select-curto" aria-label="Filtrar colaboradores por situação" name="seletor-status-ativo">
              <option value="ativos">Apenas ativos</option>
              <option value="inativos">Apenas inativos</option>
              <option value="todos">Todos os cadastros</option>
            </select>
          </div>
        </div>

        <div class="tabela-area">
          <table class="tabela">
            <thead>
              <tr>
                <th>Colaborador</th>
                <th>Cargo</th>
                <th>CNH</th>
                <th>Alocação</th>
                <th class="coluna-acoes">Ações</th>
              </tr>
            </thead>
            <tbody id="lista-colaboradores"></tbody>
          </table>
        </div>
      </section>
</template>
<template data-parte="extras"><!-- MODAL DE CADASTRO / EDIÇÃO DE COLABORADOR -->
  <div id="modal-colaborador" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-cabecalho">
        <div>
          <h2 id="modal-titulo" class="modal-titulo">Novo colaborador</h2>
          <p class="modal-subtitulo">Preencha as informações para registro no quadro da empresa</p>
        </div>
        <button type="button" id="fechar-modal" class="modal-fechar">&times;</button>
      </div>

      <form id="form-colaborador">
        <input type="hidden" id="colab-id" name="colab-id" autocomplete="off">

        <div class="modal-corpo">
          <div class="grade-campos duas-colunas">
            <div class="campo-grupo">
              <label for="colab-nome" class="campo-label">Nome completo *</label>
              <input type="text" id="colab-nome" class="config-input" placeholder="Ex: Carlos Eduardo Ramos" required name="colab-nome" autocomplete="off">
            </div>

            <div class="campo-grupo">
              <label for="colab-matricula" class="campo-label">Matrícula funcional *</label>
              <input type="text" id="colab-matricula" class="config-input" placeholder="Ex: AG-116" required name="colab-matricula" autocomplete="off" spellcheck="false" autocapitalize="none">
              <span class="campo-dica">Código único da construtora.</span>
            </div>
          </div>

          <div class="grade-campos duas-colunas">
            <div class="campo-grupo">
              <label for="colab-cargo" class="campo-label">Cargo / Função *</label>
              <input type="text" id="colab-cargo" class="config-input" placeholder="Ex: Motorista de Van" required name="colab-cargo" autocomplete="off">
            </div>

            <div class="campo-grupo">
              <label for="colab-obra" class="campo-label">Obra / Lotação principal</label>
              <input type="text" id="colab-obra" class="config-input" placeholder="Ex: Marília Norte ou Sede" name="colab-obra" autocomplete="off">
            </div>
          </div>

          <div class="grade-campos">
            <div class="campo-grupo">
              <label for="colab-telefone" class="campo-label">Telefone</label>
              <input type="text" id="colab-telefone" class="config-input" inputmode="tel" maxlength="15" placeholder="Ex: (14) 99123-4567" name="colab-telefone" autocomplete="off">
            </div>
          </div>

          <!-- seção de CNH -->
          <div class="caixa-cnh-modal">
            <label class="switch-linha">
              <div class="switch-texto">
                <span class="switch-titulo">Possui Carteira Nacional de Habilitação (CNH)</span>
                <span class="switch-desc">Habilita a pessoa para dirigir veículos da frota respeitando a categoria e a validade da carteira.</span>
              </div>
              <span class="chave">
                <input type="checkbox" id="colab-tem-cnh" name="colab-tem-cnh" autocomplete="off">
                <span class="chave-trilho"></span>
              </span>
            </label>

            <div id="campos-cnh" class="campos-cnh-detalhe" hidden>
              <div class="campo-grupo">
                <span class="campo-label">Categorias autorizadas</span>
                <div class="categorias-seletor">
                  <label class="check-categoria"><input type="checkbox" name="cat" value="A"> A (Moto)</label>
                  <label class="check-categoria"><input type="checkbox" name="cat" value="B"> B (Carro)</label>
                  <label class="check-categoria"><input type="checkbox" name="cat" value="C"> C (Caminhão)</label>
                  <label class="check-categoria"><input type="checkbox" name="cat" value="D"> D (Van/Ônibus)</label>
                  <label class="check-categoria"><input type="checkbox" name="cat" value="E"> E (Articulado)</label>
                </div>
              </div>

              <div class="campo-grupo">
                <label for="colab-cnh-validade" class="campo-label">Data de validade da CNH *</label>
                <input type="date" id="colab-cnh-validade" class="config-input campo-data" name="colab-cnh-validade" autocomplete="off">
              </div>
            </div>
          </div>
        </div>

        <div class="modal-rodape">
          <button type="button" id="cancelar-modal" class="btn-secundario">Cancelar</button>
          <button type="submit" id="botao-salvar-colaborador" class="btn-primario">Salvar colaborador</button>
        </div>
      </form>
    </div>
  </div>

  <!-- GAVETA LATERAL DE HISTÓRICO COMPLETO (ONDE DORMIU E O QUE DIRIGIU) -->
  <div id="gaveta-historico" class="gaveta-overlay" hidden>
    <div class="gaveta-painel">
      <div class="gaveta-topo">
        <div class="gaveta-perfil">
          <div id="gaveta-avatar" class="conta-avatar-grande">--</div>
          <div>
            <h2 id="gaveta-nome" class="gaveta-titulo">Nome do Colaborador</h2>
            <p id="gaveta-sub" class="gaveta-subtitulo">Matrícula · Cargo</p>
          </div>
        </div>
        <button type="button" id="fechar-gaveta" class="modal-fechar">&times;</button>
      </div>

      <!-- usa as mesmas abas do resumo (filtro-abas e aba-item) -->
      <div class="gaveta-abas">
        <div class="filtro-abas">
          <button type="button" class="aba-item gaveta-aba ativa" data-gaveta="visao">Visão geral</button>
          <button type="button" class="aba-item gaveta-aba" data-gaveta="alojamentos">Alojamentos (<span id="cont-estadias">0</span>)</button>
          <button type="button" class="aba-item gaveta-aba" data-gaveta="frota">Viagens / Frota (<span id="cont-viagens">0</span>)</button>
        </div>
      </div>

      <div class="gaveta-corpo">
        <!-- ABA 1: VISÃO GERAL -->
        <div id="gaveta-secao-visao" class="gaveta-conteudo">
          <div class="bloco gaveta-card">
            <h3 class="bloco-titulo">Situação operacional atual</h3>
            <div class="gaveta-grade-status">
              <div class="status-caixa">
                <span class="status-caixa-rotulo">Alojamento atual</span>
                <strong id="gaveta-atual-alojamento" class="status-caixa-valor">Não alojado no momento</strong>
                <span id="gaveta-atual-desde" class="status-caixa-sub">—</span>
              </div>
              <div class="status-caixa">
                <span class="status-caixa-rotulo">Veículo em uso</span>
                <strong id="gaveta-atual-veiculo" class="status-caixa-valor">Nenhum veículo em posse</strong>
                <span id="gaveta-atual-destino" class="status-caixa-sub">—</span>
              </div>
            </div>
          </div>

          <div class="bloco gaveta-card">
            <h3 class="bloco-titulo">Habilitação e Contato</h3>
            <div class="gaveta-lista-dados">
              <div class="dado-linha">
                <span class="dado-rotulo">Telefone:</span>
                <strong id="gaveta-tel">—</strong>
              </div>
              <div class="dado-linha">
                <span class="dado-rotulo">Obra principal:</span>
                <strong id="gaveta-obra">—</strong>
              </div>
              <div class="dado-linha">
                <span class="dado-rotulo">Categorias CNH:</span>
                <strong id="gaveta-cnh-cat">—</strong>
              </div>
              <div class="dado-linha">
                <span class="dado-rotulo">Validade da CNH:</span>
                <strong id="gaveta-cnh-val">—</strong>
              </div>
              <div class="dado-linha">
                <span class="dado-rotulo">Situação legal:</span>
                <span id="gaveta-cnh-tag" class="status-tag">—</span>
              </div>
            </div>
          </div>
        </div>

        <!-- ABA 2: HISTÓRICO DE ALOJAMENTOS -->
        <div id="gaveta-secao-alojamentos" class="gaveta-conteudo" hidden>
          <div class="bloco gaveta-card">
            <h3 class="bloco-titulo">Onde dormiu (estadias registradas)</h3>
            <div id="gaveta-lista-estadias" class="timeline-lista"></div>
          </div>
        </div>

        <!-- ABA 3: HISTÓRICO DE FROTA -->
        <div id="gaveta-secao-frota" class="gaveta-conteudo" hidden>
          <div class="bloco gaveta-card">
            <h3 class="bloco-titulo">Veículos que conduziu (como motorista)</h3>
            <div id="gaveta-lista-motorista" class="timeline-lista"></div>
          </div>

          <div class="bloco gaveta-card gaveta-card-espacado">
            <h3 class="bloco-titulo">Viagens que integrou (como passageiro)</h3>
            <div id="gaveta-lista-passageiro" class="timeline-lista"></div>
          </div>
        </div>
      </div>

      <div class="gaveta-rodape">
        <button type="button" id="gaveta-botao-editar" class="btn-secundario">Editar dados</button>
        <button type="button" id="gaveta-botao-status" class="btn-secundario">Desativar colaborador</button>
      </div>
    </div>
  </div>

  <div id="toast-colab" class="toast" hidden></div>
</template>
