<!-- Fragmento da tela "Frota": a casca (app.html) encaixa cada parte no lugar certo. -->
<template data-parte="cabecalho" data-titulo="Frota">
        <h1 class="topo-titulo">Frota</h1>
        <span class="topo-data">Veículos, saídas, voltas e manutenções</span>
</template>
<template data-parte="acoes" data-classe=""><button type="button" id="botao-saida-geral" class="btn-secundario">Registrar saída</button>
        <button type="button" id="botao-novo-veiculo" class="btn-primario">+ Novo veículo</button>
</template>
<template data-parte="conteudo" data-classe="conteudo">

      <section class="indicadores">
        <div class="cartao-kpi">
          <div class="kpi-topo"><span class="kpi-rotulo">Disponíveis</span></div>
          <div class="kpi-valor-linha"><strong id="kpi-disponiveis" class="kpi-numero">0</strong><span id="kpi-total" class="kpi-complemento">de 0 veículos</span></div>
          <p class="kpi-detalhe">Prontos para sair</p>
        </div>
        <div class="cartao-kpi">
          <div class="kpi-topo"><span class="kpi-rotulo">Em uso</span></div>
          <div class="kpi-valor-linha"><strong id="kpi-em-uso" class="kpi-numero">0</strong><span class="kpi-complemento">na rua agora</span></div>
          <p class="kpi-detalhe">Aguardando registro de volta</p>
        </div>
        <div class="cartao-kpi">
          <div class="kpi-topo"><span class="kpi-rotulo">Em manutenção</span></div>
          <div class="kpi-valor-linha"><strong id="kpi-manutencao" class="kpi-numero">0</strong><span class="kpi-complemento">na oficina</span></div>
          <p class="kpi-detalhe">Bloqueados para saída</p>
        </div>
        <div class="cartao-kpi">
          <div class="kpi-topo"><span class="kpi-rotulo">Documentos</span></div>
          <div class="kpi-valor-linha"><strong id="kpi-docs" class="kpi-numero">0</strong><span class="kpi-complemento">vencidos ou vencendo</span></div>
          <p class="kpi-detalhe">Licenciamento e seguro</p>
        </div>
      </section>

      <section class="bloco">
        <div class="bloco-cabecalho">
          <h2 class="bloco-titulo">Veículos</h2>
          <select id="seletor-status" class="config-select select-curto" aria-label="Filtrar veículos por situação" name="seletor-status">
            <option value="ativos">Apenas ativos</option>
            <option value="inativos">Apenas inativos</option>
            <option value="todos">Todos</option>
          </select>
        </div>
        <div class="tabela-area">
          <table class="tabela">
            <thead>
              <tr>
                <th>Veículo</th>
                <th>Status</th>
                <th class="num">Km atual</th>
                <th>Documentos</th>
                <th>Em uso</th>
                <th class="coluna-acoes">Ações</th>
              </tr>
            </thead>
            <tbody id="lista-veiculos"></tbody>
          </table>
        </div>
      </section>
</template>
<template data-parte="extras"><!-- MODAL: VEICULO -->
  <div id="modal-veiculo" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-cabecalho">
        <div>
          <h2 id="modal-veic-titulo" class="modal-titulo">Novo veículo</h2>
          <p class="modal-subtitulo">Licenciamento vencido bloqueia a saída; seguro vencido só avisa</p>
        </div>
        <button type="button" class="modal-fechar" data-fechar="modal-veiculo">&times;</button>
      </div>
      <form id="form-veiculo">
        <input type="hidden" id="veic-id" name="veic-id" autocomplete="off">
        <div class="modal-corpo">
          <div class="grade-campos duas-colunas">
            <div class="campo-grupo">
              <label for="veic-placa" class="campo-label">Placa *</label>
              <input type="text" id="veic-placa" class="config-input" placeholder="ABC-1234" required name="veic-placa" autocomplete="off" spellcheck="false" autocapitalize="none">
            </div>
            <div class="campo-grupo">
              <label for="veic-modelo" class="campo-label">Modelo *</label>
              <input type="text" id="veic-modelo" class="config-input" placeholder="Ex: Toyota Hilux" required name="veic-modelo" autocomplete="off">
            </div>
          </div>
          <div class="grade-campos duas-colunas">
            <div class="campo-grupo">
              <label for="veic-lugares" class="campo-label">Lugares (com o motorista) *</label>
              <input type="number" id="veic-lugares" class="config-input" min="1" required name="veic-lugares" autocomplete="off" inputmode="numeric">
            </div>
            <div class="campo-grupo">
              <label for="veic-categoria" class="campo-label">Categoria de CNH exigida *</label>
              <select id="veic-categoria" class="config-select" name="veic-categoria">
                <option value="B">B (carro)</option>
                <option value="A">A (moto)</option>
                <option value="C">C (caminhão)</option>
                <option value="D">D (van/ônibus)</option>
                <option value="E">E (articulado)</option>
              </select>
            </div>
          </div>
          <div class="grade-campos duas-colunas">
            <div class="campo-grupo">
              <label for="veic-km" class="campo-label">Km no cadastro</label>
              <input type="number" id="veic-km" class="config-input" min="0" value="0" name="veic-km" autocomplete="off" inputmode="numeric">
            </div>
            <div class="campo-grupo"></div>
          </div>
          <div class="grade-campos duas-colunas">
            <div class="campo-grupo">
              <label for="veic-licenciamento" class="campo-label">Validade do licenciamento</label>
              <input type="date" id="veic-licenciamento" class="config-input campo-data" name="veic-licenciamento" autocomplete="off">
            </div>
            <div class="campo-grupo">
              <label for="veic-seguro" class="campo-label">Validade do seguro</label>
              <input type="date" id="veic-seguro" class="config-input campo-data" name="veic-seguro" autocomplete="off">
            </div>
          </div>
        </div>
        <div class="modal-rodape">
          <button type="button" class="btn-secundario" data-fechar="modal-veiculo">Cancelar</button>
          <button type="submit" class="btn-primario">Salvar veículo</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: SAIDA -->
  <div id="modal-saida" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-cabecalho">
        <div>
          <h2 class="modal-titulo">Registrar saída</h2>
          <p class="modal-subtitulo">Valida CNH, lugares, documentos, manutenção e km</p>
        </div>
        <button type="button" class="modal-fechar" data-fechar="modal-saida">&times;</button>
      </div>
      <form id="form-saida">
        <div class="modal-corpo">
          <div class="grade-campos duas-colunas">
            <div class="campo-grupo">
              <label for="saida-veiculo" class="campo-label">Veículo *</label>
              <select id="saida-veiculo" class="config-select" required name="saida-veiculo"></select>
            </div>
            <div class="campo-grupo">
              <label for="saida-motorista" class="campo-label">Motorista *</label>
              <select id="saida-motorista" class="config-select" required name="saida-motorista"></select>
            </div>
          </div>
          <div class="grade-campos duas-colunas">
            <div class="campo-grupo">
              <label for="saida-destino" class="campo-label">Destino *</label>
              <input type="text" id="saida-destino" class="config-input" placeholder="Ex: Obra Marília Norte" required name="saida-destino" autocomplete="off">
            </div>
            <div class="campo-grupo">
              <label for="saida-km" class="campo-label">Km de saída *</label>
              <input type="number" id="saida-km" class="config-input" min="0" required name="saida-km" autocomplete="off" inputmode="numeric">
            </div>
          </div>
          <div class="campo-grupo">
            <span class="campo-label">Passageiros</span>
            <div id="saida-passageiros" class="lista-passageiros"></div>
          </div>
        </div>
        <div class="modal-rodape">
          <button type="button" class="btn-secundario" data-fechar="modal-saida">Cancelar</button>
          <button type="submit" class="btn-primario">Registrar saída</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: VOLTA -->
  <div id="modal-volta" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-cabecalho">
        <div>
          <h2 class="modal-titulo">Registrar volta</h2>
          <p id="volta-resumo" class="modal-subtitulo"></p>
        </div>
        <button type="button" class="modal-fechar" data-fechar="modal-volta">&times;</button>
      </div>
      <form id="form-volta">
        <input type="hidden" id="volta-uso-id" name="volta-uso-id" autocomplete="off">
        <div class="modal-corpo">
          <div class="campo-grupo">
            <label for="volta-km" class="campo-label">Km de volta *</label>
            <input type="number" id="volta-km" class="config-input" min="0" required name="volta-km" autocomplete="off" inputmode="numeric">
          </div>
        </div>
        <div class="modal-rodape">
          <button type="button" class="btn-secundario" data-fechar="modal-volta">Cancelar</button>
          <button type="submit" class="btn-primario">Registrar volta</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: MANUTENCAO -->
  <div id="modal-manutencao" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-cabecalho">
        <div>
          <h2 class="modal-titulo">Nova manutenção</h2>
          <p class="modal-subtitulo">O veículo fica bloqueado para saída até a conclusão</p>
        </div>
        <button type="button" class="modal-fechar" data-fechar="modal-manutencao">&times;</button>
      </div>
      <form id="form-manutencao">
        <div class="modal-corpo">
          <div class="grade-campos duas-colunas">
            <div class="campo-grupo">
              <label for="manut-tipo" class="campo-label">Tipo *</label>
              <select id="manut-tipo" class="config-select" name="manut-tipo">
                <option value="preventiva">Preventiva</option>
                <option value="corretiva">Corretiva</option>
              </select>
            </div>
            <div class="campo-grupo">
              <label for="manut-km" class="campo-label">Km</label>
              <input type="number" id="manut-km" class="config-input" min="0" name="manut-km" autocomplete="off" inputmode="numeric">
            </div>
          </div>
          <div class="campo-grupo">
            <label for="manut-descricao" class="campo-label">Descrição *</label>
            <input type="text" id="manut-descricao" class="config-input" placeholder="Ex: Troca de óleo e filtros" required name="manut-descricao" autocomplete="off">
          </div>
        </div>
        <div class="modal-rodape">
          <button type="button" class="btn-secundario" data-fechar="modal-manutencao">Cancelar</button>
          <button type="submit" class="btn-primario">Abrir manutenção</button>
        </div>
      </form>
    </div>
  </div>

  <!-- GAVETA: DETALHE DO VEICULO -->
  <div id="gaveta-veiculo" class="gaveta-overlay" hidden>
    <div class="gaveta-painel">
      <div class="gaveta-topo">
        <div>
          <h2 id="gaveta-veic-nome" class="gaveta-titulo">Veículo</h2>
          <p id="gaveta-veic-sub" class="gaveta-subtitulo"></p>
        </div>
        <button type="button" id="fechar-gaveta" class="modal-fechar">&times;</button>
      </div>
      <div class="gaveta-abas">
        <div class="filtro-abas">
          <button type="button" class="aba-item gaveta-aba ativa" data-gaveta="usos">Usos (<span id="cont-usos">0</span>)</button>
          <button type="button" class="aba-item gaveta-aba" data-gaveta="manutencoes">Manutenções (<span id="cont-manut">0</span>)</button>
        </div>
      </div>
      <div class="gaveta-corpo">
        <div id="gaveta-secao-usos" class="gaveta-conteudo">
          <div id="gaveta-lista-usos" class="timeline-lista"></div>
        </div>
        <div id="gaveta-secao-manutencoes" class="gaveta-conteudo" hidden>
          <button type="button" id="botao-nova-manutencao" class="btn-secundario">+ Nova manutenção</button>
          <div id="gaveta-lista-manut" class="timeline-lista"></div>
        </div>
      </div>
      <div class="gaveta-rodape">
        <button type="button" id="gaveta-botao-editar" class="btn-secundario">Editar dados</button>
        <button type="button" id="gaveta-botao-status" class="btn-secundario">Desativar</button>
      </div>
    </div>
  </div>

  <div id="toast-frota" class="toast" hidden></div>
</template>
