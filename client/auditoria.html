<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/resumo.css">

  <link rel="stylesheet" href="css/alojamentos.css">

  <link rel="stylesheet" href="css/relatorios.css">
</head>
<body class="painel-corpo">

  <!-- menu lateral fixo -->
  <aside class="menu-lateral">
    <div>
      <div class="menu-marca">
        <span class="menu-logo">Dispatch</span>
        <span id="nome-empresa-menu" class="menu-empresa">Construtora Aguapeí</span>
      </div>

      <p class="menu-secao">OPERAÇÃO</p>

      <nav class="menu-lista">
        <a href="resumo.html" class="menu-item">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span>Visão Geral</span>
        </a>

        <a href="colaboradores.html" class="menu-item">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span>Colaboradores</span>
        </a>

        <a href="alojamentos.html" class="menu-item">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18"/>
            <path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/>
            <path d="M9 7h1.5M13.5 7H15M9 11h1.5M13.5 11H15M9 15h1.5M13.5 15H15"/>
          </svg>
          <span>Alojamentos</span>
        </a>

        <a href="frota.html" class="menu-item">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="6" width="14" height="10" rx="1"/>
            <path d="M15 9h4l3 3.5V16h-7V9z"/>
            <circle cx="5.5" cy="17.5" r="2"/>
            <circle cx="18.5" cy="17.5" r="2"/>
          </svg>
          <span>Frota</span>
        </a>

        <a href="relatorios.html#movimentacoes" class="menu-item">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"/>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <polyline points="7 23 3 19 7 15"/>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
          <span>Movimentações</span>
        </a>

        <a href="relatorios.html" class="menu-item">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
          <span>Relatórios</span>
        </a>
      </nav>

      <div id="bloco-menu-admin" class="menu-admin-bloco" hidden>
        <p class="menu-secao menu-secao-espaco">SISTEMA</p>
        <nav class="menu-lista">
          <a href="auditoria.html" class="menu-item ativo">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <polyline points="9 12 11 14 15 10"/>
            </svg>
            <span>Auditoria</span>
          </a>
          <a href="configuracoes.html" class="menu-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1.02 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span>Configurações</span>
          </a>
        </nav>
      </div>
    </div>

    <div class="menu-rodape">
      <div id="usuario-iniciais" class="usuario-avatar">AD</div>
      <div class="usuario-dados">
        <p id="perfil-nome" class="usuario-nome">Administrador</p>
        <p id="perfil-tipo" class="usuario-cargo">admin</p>
      </div>
      <button type="button" id="botao-sair" class="botao-sair" title="Sair do sistema">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- área de conteúdo -->
  <div class="area-conteudo">

    <header class="topo">
      <div class="topo-esquerda">
        <h1 class="topo-titulo">Auditoria</h1>
        <span class="topo-data">Quem alterou o quê, quando e como estava antes</span>
      </div>
      <div class="topo-direita">
        <button type="button" id="botao-verificar" class="btn-secundario">Verificar integridade</button>
      </div>
    </header>

    <main class="conteudo">

      <div id="caixa-integridade" class="resultado-caixa" hidden></div>

      <section class="bloco">
        <div class="bloco-cabecalho">
          <div class="colab-filtros-topo">
            <div class="busca-caixa busca-larga">
              <input type="text" id="aud-busca" placeholder="Buscar por descrição ou usuário...">
            </div>
            <select id="aud-tabela" class="config-select select-curto"><option value="">Todas as tabelas</option></select>
            <select id="aud-acao" class="config-select select-curto">
              <option value="">Todas as ações</option>
              <option value="criou">Criou</option>
              <option value="alterou">Alterou</option>
              <option value="arquivou">Arquivou</option>
            </select>
          </div>
          <span id="aud-total" class="kpi-complemento"></span>
        </div>
        <div class="tabela-area">
          <table class="tabela">
            <thead><tr><th>Quando</th><th>Usuário</th><th>Ação</th><th>Descrição</th><th>Antes → Depois</th></tr></thead>
            <tbody id="aud-lista"></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>

  <div id="toast-aud" class="toast" hidden></div>

  <script src="js/api.js"></script>
  <script src="js/auditoria.js"></script>
</body>
</html>
